[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "nitido"
version = "0.1.0"
description = "Amplia 5x, remove motion blur e realca o detalhe ao redor, sem alterar o rosto"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.22",
    "opencv-python-headless>=4.8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
nitido = "nitido.cli:main"

[tool.setuptools]
packages = ["nitido"]

[tool.pytest.ini_options]
testpaths = ["tests"]
